services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - .env
    environment:
      API_PORT: 3000
      DATABASE_URL: postgresql://massage:massage@postgres:5432/massage_vn?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "3000"

  admin_web:
    build:
      context: .
      dockerfile: infra/docker/admin_web.Dockerfile
    env_file:
      - .env
    environment:
      ADMIN_API_BASE_URL: http://api:3000/api
      PORT: 3000
    depends_on:
      - api
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - admin_web
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: massage_vn
      POSTGRES_USER: massage
      POSTGRES_PASSWORD: massage
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U massage -d massage_vn"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/massage-vn && mc anonymous set download local/massage-vn/public || true",
      ]

volumes:
  postgres_data:
  redis_data:
  minio_data:
